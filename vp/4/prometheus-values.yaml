grafana:
  enabled: true
  grafana.ini:
    plugins:
      preinstall_auto_update: false
  sidecar:
    datasources:
      url: http://10.42.0.77:9090/
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi

alertmanager:
  enabled: false

kubelet:
  serviceMonitor:
    cAdvisorInterval: 5s

prometheus:
  prometheusSpec:
    scrapeInterval: 5s
