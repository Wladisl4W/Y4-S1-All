apiVersion: batch/v1
kind: CronJob
metadata:
  name: notification-cronjob
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cronjob
              image: busybox:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - echo "CronJob executed at $(date)" >> /tmp/cronjob.log
          restartPolicy: OnFailure
